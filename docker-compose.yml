version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173" # HOST:CONTAINER (Vite runs on 5173 inside container)
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/f1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongo
      - redis
    networks:
      - app-network

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS}
    depends_on:
      - mongo
    networks:
      - app-network

  redis:
    image: redis:7
    ports:
      - "6379:6379" # Both host and container use the same port
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
